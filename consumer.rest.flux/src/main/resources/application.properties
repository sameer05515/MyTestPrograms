# Client-only: do not start an embedded web server
spring.main.web-application-type=none

# WebClient buffers full body for bodyToMono(String); GitHub page=1 with per_page=100 can exceed default 256KB
spring.codec.max-in-memory-size=10MB

# Set false for tests / CI so the app does not call GitHub on context load
app.run-on-startup=true

# GitHub user whose public repos are listed (same default as consume.rest)
app.github.user=sameer05515

# Pages to fetch (inclusive): 1 .. app.github.max-page
app.github.max-page=3

# Output HTML path (relative to working directory when you run the jar, or project root with mvn)
app.output.html=output/aa.html
